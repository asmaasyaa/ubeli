<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrator | UBeli</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Kita pasang CSS langsung di sini supaya AMAN 
           dan tidak terpengaruh oleh admin.css yang punya layout Sidebar 
        */

        :root {
            --primary: #4F46E5;       /* Indigo Utama (Sama kayak Dashboard) */
            --primary-dark: #4338CA;
            --text-dark: #111827;
            --text-gray: #6B7280;
            --bg-body: #F1F5F9;       /* Slate Gray Light */
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid #E2E8F0;
        }

        /* Badge "Administrator Access" */
        .admin-badge {
            display: inline-block;
            background-color: #1E293B; /* Dark Slate */
            color: #F8FAFC;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            margin: 0 0 30px 0;
        }
        .highlight { color: var(--primary); }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .input-control:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* Password Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
        }
        .btn-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-gray);
            padding: 0;
            display: flex;
        }
        .btn-eye:hover { color: var(--text-dark); }
        .hidden { display: none; }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background-color: var(--primary-dark);
        }

        /* Link Kembali */
        .link-back {
            display: block;
            margin-top: 25px;
            color: var(--text-gray);
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
        .link-back:hover { color: var(--primary); }

        /* Error Message */
        .alert-error {
            background-color: #FEF2F2;
            color: #DC2626;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-top: 20px;
            border: 1px solid #FECACA;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="admin-badge">Administrator Access</div>

            <h1 class="title">Masuk ke Panel <span class="highlight">UBeli</span></h1>

            <form th:action="@{/admin/proses-login}" method="POST">
                
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="input-control" placeholder="Masukkan username admin" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="passwordInput" class="input-control" placeholder="Masukkan password" required>
                        <button type="button" class="btn-eye" id="togglePassword">
                            <i data-lucide="eye" class="icon-eye"></i>
                            <i data-lucide="eye-off" class="icon-eye-off hidden"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Masuk Dashboard</button>

                <a href="/" class="link-back">← Kembali ke Website Utama</a>

            </form>

            <div th:if="${error}" class="alert-error">
                <i data-lucide="alert-circle" width="16"></i>
                <span th:text="${error}">Username atau Password Salah!</span>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        // Script Show/Hide Password
        const toggleBtn = document.getElementById('togglePassword');
        const passInput = document.getElementById('passwordInput');
        const iconEye = document.querySelector('.icon-eye');
        const iconEyeOff = document.querySelector('.icon-eye-off');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passInput.getAttribute('type') === 'password';
            passInput.setAttribute('type', isPassword ? 'text' : 'password');
            
            iconEye.classList.toggle('hidden', !isPassword);
            iconEyeOff.classList.toggle('hidden', isPassword);
        });
    </script>

</body>
</html>
