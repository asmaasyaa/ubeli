<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifikasi - UBeli</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/notifikasi.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div th:replace="fragments/navbar-penjual :: navbar-penjual"></div>

<main class="container">

    <h2 class="notif-title">Notifikasi</h2>

    <div th:each="p : ${listPesanan}" class="notif-card">

        <div class="notif-avatar"></div>

        <div class="notif-content">
            <h4 th:text="${mapNotif != null and mapNotif.containsKey(p.pesananId) 
                          ? mapNotif[p.pesananId].judul 
                          : (p.pembeli.namaLengkap + ' mengajukan pembelian')}">
                Judul Notifikasi
            </h4>
            
            <p class="notif-sub" th:text="${mapNotif != null and mapNotif.containsKey(p.pesananId) 
                          ? mapNotif[p.pesananId].subJudul 
                          : (p.produk != null ? p.produk.namaProduk : '-')}">
                Subjudul
            </p>

            <span class="notif-time"
                  th:text="${mapNotif != null and mapNotif.containsKey(p.pesananId) 
                           ? #temporals.format(mapNotif[p.pesananId].waktu, 'dd-MM-yyyy HH:mm') 
                           : ''}">
                Waktu
            </span>
        </div>

        <span class="notif-status ditolak"
              th:if="${p.statusPengajuan != null and p.statusPengajuan.name() == 'DITOLAK'}">
            Ditolak
        </span>

        <span class="notif-status menunggu"
              th:if="${p.statusPengajuan != null and p.statusPengajuan.name() == 'PENDING'}">
            Menunggu
        </span>

        <span class="notif-status dibayar" style="background: #d4edda; color: #155724; border: 1px solid #c3e6cb;"
              th:if="${p.statusPesanan != null and p.statusPesanan.name() == 'DIBAYAR'}">
            <i class="fas fa-box"></i> Siap Kirim
        </span>

        <span class="notif-status dikirim" style="background: #cce5ff; color: #004085; border: 1px solid #b8daff;"
              th:if="${p.statusPesanan != null and p.statusPesanan.name() == 'DIKIRIM'}">
            <i class="fas fa-truck"></i> Sedang Dikirim
        </span>
        
        <span class="notif-status selesai" style="background: #d4edda; color: #155724;"
              th:if="${p.statusPesanan != null and p.statusPesanan.name() == 'SELESAI'}">
            <i class="fas fa-check-circle"></i> Selesai
        </span>

        <span class="notif-status diterima"
              th:if="${p.statusPengajuan != null and p.statusPengajuan.name() == 'DITERIMA' 
                       and (p.statusPesanan == null or p.statusPesanan.name() == 'MENUNGGU_PEMBAYARAN' or p.statusPesanan.name() == 'VERIFIKASI_ADMIN')}">
            Menunggu Bayar
        </span>

        <div class="notif-actions">

            <th:block th:if="${p.statusPengajuan != null and p.statusPengajuan.name() == 'PENDING'}">
                <button class="btn-tolak" th:attr="data-id=${p.pesananId}">
                    Tolak
                </button>
                <button class="btn-terima" th:attr="data-id=${p.pesananId}">
                    Terima
                </button>
            </th:block>

            <form th:if="${p.statusPesanan != null and p.statusPesanan.name() == 'DIBAYAR'}"
                  th:action="@{/transaksi/kirim-barang}" method="post"
                  style="display: inline-block;">
                
                <input type="hidden" name="pesananId" th:value="${p.pesananId}">
                
                <button type="submit" class="btn-primary" 
                        style="background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
                    <i class="fas fa-truck"></i> Konfirmasi Kirim
                </button>
            </form>

        </div>

    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // Event Listener untuk Tombol Terima (Pending)
    document.querySelectorAll(".btn-terima").forEach(btn => {
        btn.addEventListener("click", function () {
            let id = this.dataset.id;
            if (confirm("Yakin ingin MENERIMA pengajuan ini?")) {
                this.disabled = true;
                window.location.href = "/terima/" + id;
            }
        });
    });

    // Event Listener untuk Tombol Tolak (Pending)
    document.querySelectorAll(".btn-tolak").forEach(btn => {
        btn.addEventListener("click", function () {
            let id = this.dataset.id;
            if (confirm("Yakin ingin MENOLAK pengajuan ini?")) {
                this.disabled = true;
                window.location.href = "/tolak/" + id;
            }
        });
    });
});
</script>

</body>
</html>
